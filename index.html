<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Strict Anti-Caching & Instant GitHub Pages Sync -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0, post-check=0, pre-check=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="cache-control" content="no-cache" />
    <meta name="expires" content="0" />
    <meta name="pragma" content="no-cache" />

    <!-- Service Worker / Cache Storage Auto-Unregister (Eliminates Stale GitHub Pages Caches) -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) caches.delete(name);
        });
      }
    </script>
    
    <!-- Security / Anti-Copy Script -->
    <script>
      // Disable Right Click
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

      // Disable Copy, Cut, Paste
      document.addEventListener('copy', function(e) {
        e.preventDefault();
      });
      document.addEventListener('cut', function(e) {
        e.preventDefault();
      });
      document.addEventListener('paste', function(e) {
        e.preventDefault();
      });

      // Disable specific keyboard shortcuts (Ctrl+C, Ctrl+V, Ctrl+X, Ctrl+U, Ctrl+S, Ctrl+P, F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C)
      document.addEventListener('keydown', function(e) {
        if (
          e.key === 'F12' || 
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
          (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'C' || e.key === 'c' || e.key === 'V' || e.key === 'v' || e.key === 'X' || e.key === 'x' || e.key === 'S' || e.key === 's' || e.key === 'P' || e.key === 'p'))
        ) {
          e.preventDefault();
        }
      });
    </script>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Prism CSS for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="Advance your software engineering skills with VinnerTECH Interview Guide. Comprehensive interview preparation for .NET, C#, Python, Java, React, SQL, and more." />
    <meta name="keywords" content="interview preparation, software engineering, .NET, C#, Python, Java, React, SQL, backend developer, frontend developer, full stack interview, coding questions" />
    <meta name="author" content="VinnerTECH" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-video-preview:-1, max-image-preview:large" />
    <link rel="canonical" href="https://vinnertech.github.io/" />

    <!-- Open Graph / Facebook (for AI Previews and Social Sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vinnertech.github.io/" />
    <meta property="og:title" content="VinnerTECH - Ultimate Software Engineering Interview Guide" />
    <meta property="og:description" content="Master your next technical interview with comprehensive, real-world questions and answers curated for top software engineering roles." />
    <meta property="og:site_name" content="VinnerTECH Interview Guide" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VinnerTECH - Ultimate Software Engineering Interview Guide" />
    <meta name="twitter:description" content="Master your next technical interview with comprehensive, real-world questions and answers curated for top software engineering roles." />

    <!-- Structured Data (JSON-LD) for Google AI / Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "VinnerTECH Interview Guide",
      "url": "https://vinnertech.github.io/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://vinnertech.github.io/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <title>Enterprise Interview Guide Portal | VinnerTECH</title>
    <!-- SPA redirect script (to handle 404 fallback from GitHub Pages) -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Prism JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-csharp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
  </body>
</html>
